<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance Tracker v1.0</title>

  <link rel="icon" href="/fingerprintscan.png" type="image/png" sizes="192×192">
  <meta name="theme-color" content="#0d1b2a">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0a1421;
      --card: #111827;
      --border: #1e40af;
      --accent: #3b82f6;
      --text: #e2e8f0;
      --work: #60a5fa;
      --break: #f87171;
      --ot: #fbbf24;
      --green: #22c55e;
      --red: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Share Tech Mono', monospace;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 1.5rem 1rem;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    h1 {
      font-size: clamp(2rem, 5.5vw, 3.2rem);
      color: var(--accent);
      letter-spacing: 0.08em;
      margin-bottom: 0.6rem;
    }

    .welcome {
      font-size: 1.25rem;
      color: #94a3b8;
    }

    .welcome span {
      color: var(--accent);
      font-weight: 700;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.2rem;
      margin: 2rem 0 3rem;
    }

    .time-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.4rem 1rem;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      position: relative;
      overflow: hidden;
    }

    .time-card::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 12px;
      padding: 1px;
      background: linear-gradient(90deg, transparent, var(--border), transparent);
      -webkit-mask: 
        linear-gradient(#fff 0 0) content-box, 
        linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    .time-card h3 {
      font-size: 0.95rem;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      margin-bottom: 0.9rem;
    }

    .timer {
      font-size: clamp(2.6rem, 9vw, 4.2rem);
      font-weight: 700;
      letter-spacing: 0.12em;
      font-variant-numeric: tabular-nums;
      line-height: 1.05;
      text-shadow: 
        0 0 6px currentColor,
        0 0 12px currentColor;
      filter: brightness(1.15);
    }

    .timer.work  { color: var(--work); }
    .timer.break { color: var(--break); }
    .timer.ot    { color: var(--ot); }

    .actions {
      text-align: center;
      margin: 2.5rem 0 3rem;
    }

    .actions h2 {
      color: #64748b;
      font-size: 1.3rem;
      margin-bottom: 1.2rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .punch-buttons {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      flex-wrap: wrap;
    }

    .btn {
      padding: 1.1rem 2.4rem;
      font-size: 1.2rem;
      font-weight: 700;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.18s ease;
      min-width: 180px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .btn-green {
      background: var(--green);
      color: #000;
      box-shadow: 0 0 15px rgba(34,197,94,0.5);
    }

    .btn-red {
      background: var(--red);
      color: white;
      box-shadow: 0 0 15px rgba(239,68,68,0.5);
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      box-shadow: none;
    }

    .btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.6);
    }

    .logs-section,
    .summary-section {
      margin: 2.5rem 0;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.8rem;
    }

    .section-title {
      color: var(--accent);
      font-size: 1.25rem;
      margin-bottom: 1.2rem;
      text-align: center;
      letter-spacing: 0.05em;
    }

    #logs {
      background: #0f172a;
      border-radius: 8px;
      padding: 1.2rem;
      min-height: 100px;
      font-size: 0.98rem;
      line-height: 1.6;
      color: #cbd5e1;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1rem;
      font-size: 0.95rem;
    }

    th, td {
      padding: 1rem;
      text-align: center;
      border-bottom: 1px solid #1e293b;
    }

    th {
      background: #1e293b;
      color: var(--accent);
      text-transform: uppercase;
      font-size: 0.85rem;
      letter-spacing: 0.08em;
    }

    #login {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      gap: 1.8rem;
    }

    .input {
      width: 100%;
      max-width: 360px;
      padding: 1rem;
      font-size: 1.1rem;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      color: var(--text);
      font-family: inherit;
    }

    .message {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 1rem 2rem;
      border-radius: 8px;
      font-weight: bold;
      z-index: 1000;
      min-width: 280px;
      text-align: center;
      box-shadow: 0 6px 20px rgba(0,0,0,0.6);
    }

    .msg-ok   { background: var(--green); color: #000; }
    .msg-err  { background: var(--red);    color: white; }

    @media (max-width: 720px) {
      .stats { grid-template-columns: 1fr; gap: 1.5rem; }
      .punch-buttons { flex-direction: column; align-items: center; gap: 1rem; }
      .btn { width: 100%; max-width: 320px; }
      .timer { font-size: clamp(2.4rem, 10vw, 3.6rem); }
    }
  </style>
</head>
<body>

<!-- Login Screen -->
<div id="login">
  <h1 style="color: var(--accent);">Attendance Tracker</h1>
  <input id="username" class="input" placeholder="Username" autocomplete="username">
  <input id="password" class="input" type="password" placeholder="Password" autocomplete="current-password">
  <button id="loginBtn" class="btn btn-green">LOGIN</button>
</div>

<!-- Main App -->
<div id="app" class="container" style="display: none;">

  <header>
    <h1>Attendance Tracker</h1>
    <div class="welcome">Welcome, <span id="empName"></span></div>
  </header>

  <div class="stats">
    <div class="time-card">
      <h3>TOTAL WORK TODAY</h3>
      <div id="workTime" class="timer work">00:00:00</div>
    </div>
    <div class="time-card">
      <h3>TOTAL BREAK TODAY</h3>
      <div id="breakTime" class="timer break">00:00:00</div>
    </div>
    <div class="time-card">
      <h3>OVERTIME TODAY</h3>
      <div id="otTime" class="timer ot">00:00:00</div>
    </div>
  </div>

  <div class="actions">
    <h2>Actions</h2>
    <div class="punch-buttons">
      <button id="punchIn" class="btn btn-green" disabled>PUNCH IN</button>
      <button id="punchOut" class="btn btn-red" disabled>PUNCH OUT</button>
    </div>
  </div>

  <div class="logs-section">
    <div class="section-title">Today's Sessions</div>
    <div id="logs">Loading today's sessions...</div>
  </div>

  <div class="summary-section">
    <div class="section-title">Daily Summary</div>
    <button id="refreshSummary" class="btn btn-green" style="display:block; margin:0 auto 1.5rem; min-width:180px;">
      Refresh Summary
    </button>
    <table id="summaryTable">
      <thead>
        <tr><th>Date</th><th>Work</th><th>Break</th><th>Overtime</th></tr>
      </thead>
      <tbody>
        <tr><td colspan="4">No records yet</td></tr>
      </tbody>
    </table>
  </div>

</div>
<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyiy193XUlBQnr2JcPKCu3DIB1de65pQh0xS5jOLrYCjmCRKjnOhnTP3Q791jCEh_fl/exec';

let employeeName = '';
let punchCount = 0;
let timer = null;
let notificationPermission = false;

const punchInBtn = document.getElementById('punchIn');
const punchOutBtn = document.getElementById('punchOut');
const workEl = document.getElementById('workTime');
const breakEl = document.getElementById('breakTime');
const otEl = document.getElementById('otTime');
const logsEl = document.getElementById('logs');
const warningBox = document.getElementById('warningBox');

function formatTime(sec) {
  const h = Math.floor(sec / 3600).toString().padStart(2, '0');
  const m = Math.floor((sec % 3600) / 60).toString().padStart(2, '0');
  const s = Math.floor(sec % 60).toString().padStart(2, '0');
  return `${h}:${m}:${s}`;
}

function show(msg, type = 'ok') {
  const div = document.createElement('div');
  div.className = `message ${type === 'ok' ? 'msg-ok' : type === 'err' ? 'msg-err' : 'msg-warn'}`;
  div.textContent = msg;
  document.body.appendChild(div);
  setTimeout(() => div.remove(), 5000);
}

function showWarning(msg) {
  warningBox.textContent = msg;
  warningBox.style.display = msg ? 'block' : 'none';
}

async function requestNotifications() {
  if (!("Notification" in window)) return;
  if (Notification.permission === "granted") {
    notificationPermission = true;
    return;
  }
  if (Notification.permission !== "denied") {
    const perm = await Notification.requestPermission();
    notificationPermission = perm === "granted";
    if (notificationPermission) show("Notifications enabled", "ok");
  }
}

async function fetchToday() {
  if (!employeeName) return;
  try {
    const r = await fetch(SCRIPT_URL, {
      method: 'POST',
      headers: {'Content-Type': 'text/plain'},
      body: JSON.stringify({ action: 'get_today_totals', employeeName })
    });
    const d = await r.json();
    if (d.status !== 'success') throw new Error(d.message || 'failed');

    const workSec = d.workSeconds || 0;
    let breakSec = d.breakSeconds || 0;
    const otSec = d.overtimeSeconds || 0;

    workEl.textContent = formatTime(workSec);
    breakEl.textContent = formatTime(breakSec);
    otEl.textContent = formatTime(otSec);

    punchCount = d.punchCount || punchCount;

    let warning = '';
    if (punchCount >= 8) {
      warning += 'Max 8 punches reached. This is your last punch for the day. ';
    }
    if (breakSec > 2700) {
      warning += 'Break exceeded 45 minutes! ';
    }
    if (punchCount % 2 !== 0) {
      warning += 'Unmatched punch detected - please check your sessions. ';
    }
    if (workSec + breakSec / 60 > 540) {
      warning += 'Total day time exceeded 9 hours including break. ';
    }
    showWarning(warning);

    if (notificationPermission && otSec > 3600) {
      new Notification("Overtime Alert", { body: `You have ${formatTime(otSec)} overtime.`, icon: 'https://via.placeholder.com/192/f59e0b/0d1b2a?text=OT' });
    }
    if (notificationPermission && breakSec > 2700) {
      new Notification("Break Exceeded", { body: `Break is ${formatTime(breakSec)} - exceeded 45 min limit.`, icon: 'https://via.placeholder.com/192/ef4444/0d1b2a?text=BRK' });
    }
  } catch (e) {
    console.warn(e);
    show("Error updating timers", 'err');
  }
}

async function loadSummary() {
  if (!employeeName) return;
  const tbody = document.querySelector('#summaryTable tbody');
  tbody.innerHTML = '<tr><td colspan="4">Loading...</td></tr>';

  try {
    const r = await fetch(SCRIPT_URL, {
      method: 'POST',
      headers: {'Content-Type': 'text/plain'},
      body: JSON.stringify({ action: 'get_daily_summary', employeeName })
    });
    const d = await r.json();
    if (d.status !== 'success') throw new Error(d.message || 'failed');

    tbody.innerHTML = '';
    if (d.summaries.length === 0) {
      tbody.innerHTML = '<tr><td colspan="4">No records yet</td></tr>';
      return;
    }
    d.summaries.forEach(row => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${row.date}</td>
        <td>${formatTime(row.work)}</td>
        <td>${formatTime(row.break)}</td>
        <td>${formatTime(row.overtime)}</td>
      `;
      tbody.appendChild(tr);
    });
  } catch (e) {
    tbody.innerHTML = '<tr><td colspan="4">Error loading summary</td></tr>';
    show("Error loading summary", 'err');
  }
}

async function fetchLogs() {
  logsEl.innerHTML = 'Loading today\'s sessions...';
  try {
    const r = await fetch(SCRIPT_URL, {
      method: 'POST',
      headers: {'Content-Type': 'text/plain'},
      body: JSON.stringify({ action: 'get_today_totals', employeeName })
    });
    const d = await r.json();
    logsEl.innerHTML = 'Sessions loaded from sheet.';
  } catch (e) {
    logsEl.innerHTML = 'Error loading logs';
  }
}

document.getElementById('loginBtn').onclick = async () => {
  const u = document.getElementById('username').value.trim();
  const p = document.getElementById('password').value.trim();
  if (!u || !p) return show("Enter username & password", "err");

  try {
    const r = await fetch(SCRIPT_URL, {
      method: 'POST',
      headers: {'Content-Type': 'text/plain'},
      body: JSON.stringify({ action: 'login', username: u, password: p })
    });
    const d = await r.json();
    if (d.status !== 'success') throw new Error(d.message || 'Login failed');

    employeeName = d.employeeName;
    document.getElementById('empName').textContent = employeeName;
    document.getElementById('login').style.display = 'none';
    document.getElementById('app').style.display = 'block';

    punchInBtn.disabled = false;
    requestNotifications();
    fetchToday();
    fetchLogs();
    loadSummary();
    timer = setInterval(fetchToday, 30000);
  } catch (e) {
    show(e.message || "Connection error", "err");
  }
};

punchInBtn.onclick = async () => {
  if (punchCount >= 8) return show("Max punches reached for today", "err");
  punchInBtn.disabled = true;
  punchOutBtn.disabled = false;
  try {
    await fetch(SCRIPT_URL, {
      method: 'POST',
      headers: {'Content-Type': 'text/plain'},
      body: JSON.stringify({ employeeName, punchType: 'PUNCH IN', timestamp: new Date().toISOString(), source: 'Web' })
    });
    punchCount++;
    fetchToday();
    fetchLogs();
    show("PUNCH IN recorded", "ok");
  } catch (e) {
    show("Error recording punch", "err");
    punchInBtn.disabled = false;
    punchOutBtn.disabled = true;
  }
};

punchOutBtn.onclick = async () => {
  if (punchCount >= 8) return show("Max punches reached for today", "err");
  punchInBtn.disabled = false;
  punchOutBtn.disabled = true;
  try {
    await fetch(SCRIPT_URL, {
      method: 'POST',
      headers: {'Content-Type': 'text/plain'},
      body: JSON.stringify({ employeeName, punchType: 'PUNCH OUT', timestamp: new Date().toISOString(), source: 'Web' })
    });
    punchCount++;
    fetchToday();
    fetchLogs();
    show("PUNCH OUT recorded", "ok");
  } catch (e) {
    show("Error recording punch", "err");
    punchInBtn.disabled = true;
    punchOutBtn.disabled = false;
  }
};

document.getElementById('refreshSummary').onclick = loadSummary;
</script>

</body>
</html>
