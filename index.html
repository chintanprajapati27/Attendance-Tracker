<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance Tracker</title>

  <link rel="icon" href="/fingerprintscan.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/fingerprintscan.png" sizes="180x180">
  <meta name="theme-color" content="#0d1b2a">

  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0b132b;
      --card: #1c2526;
      --neon-blue: #00f0ff;
      --neon-cyan: #00d4ff;
      --text: #e0fbfc;
      --work: #00f0ff;
      --break: #ff3366;
      --ot: #ffcc00;
      --green: #00ff9f;
      --red: #ff3366;
      --accent: #00d4ff;
    }

    * { box-sizing: border-box; margin:0; padding:0; }

    body {
      font-family: 'Share Tech Mono', monospace;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 1.5rem 1rem;
      line-height: 1.4;
    }

    .container { max-width: 1280px; margin: 0 auto; }

    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    h1 {
      font-size: clamp(2.2rem, 6vw, 3.8rem);
      color: var(--neon-cyan);
      letter-spacing: 0.12em;
      text-shadow: 0 0 10px var(--neon-cyan);
      margin-bottom: 0.8rem;
    }

    .welcome {
      font-size: 1.4rem;
      color: #a5b4fc;
    }

    .welcome strong {
      color: var(--accent);
      text-shadow: 0 0 8px var(--accent);
    }

    .timers-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1.5rem;
      margin: 2rem 0 3.5rem;
    }

    .timer-card {
      background: var(--card);
      border: 1px solid #2a4d69;
      border-radius: 12px;
      padding: 1.4rem 1.8rem 1.8rem;
      min-width: 280px;
      flex: 1 1 300px;
      max-width: 380px;
      box-shadow: 
        inset 0 0 12px rgba(0, 240, 255, 0.08),
        0 0 20px rgba(0, 212, 255, 0.12);
      position: relative;
    }

    .timer-card h3 {
      font-size: 0.95rem;
      color: #4a90e2;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      text-align: center;
      margin-bottom: 1rem;
    }

    .timer {
      font-size: clamp(3rem, 10vw, 5.2rem);
      font-weight: 700;
      letter-spacing: 0.14em;
      font-variant-numeric: tabular-nums;
      color: currentColor;
      text-align: center;
      text-shadow: 
        0 0 4px currentColor,
        0 0 8px currentColor,
        0 0 16px currentColor,
        0 0 24px rgba(0,0,0,0.6);
      filter: brightness(1.1);
      line-height: 1.1;
    }

    .timer.work  { color: var(--work); }
    .timer.break { color: var(--break); }
    .timer.ot    { color: var(--ot); }

    .actions-section {
      text-align: center;
      margin: 3rem 0 4rem;
    }

    .actions-section h2 {
      font-size: 1.5rem;
      color: #64748b;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 1.8rem;
    }

    .punch-buttons {
      display: flex;
      justify-content: center;
      gap: 2rem;
      flex-wrap: wrap;
    }

    .btn {
      padding: 1.2rem 2.8rem;
      font-size: 1.3rem;
      font-weight: 700;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
      min-width: 220px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }

    .btn-green {
      background: var(--green);
      color: #000;
      box-shadow: 0 0 20px rgba(0,255,159,0.5);
    }

    .btn-red {
      background: var(--red);
      color: white;
      box-shadow: 0 0 20px rgba(255,51,102,0.5);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      box-shadow: none;
    }

    .btn:hover:not(:disabled) {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(0,0,0,0.6);
    }

    .section {
      background: var(--card);
      border: 1px solid #2a4d69;
      border-radius: 12px;
      padding: 2rem;
      margin: 2.5rem 0;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    .section-title {
      font-size: 1.4rem;
      color: var(--neon-cyan);
      text-align: center;
      margin-bottom: 1.5rem;
      letter-spacing: 0.1em;
    }

    #logs {
      background: #0f1a36;
      border-radius: 8px;
      padding: 1.4rem;
      min-height: 120px;
      font-size: 1rem;
      color: #cbd5e1;
      line-height: 1.6;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1.2rem;
    }

    th, td {
      padding: 1.1rem;
      text-align: center;
      border-bottom: 1px solid #1e293b;
    }

    th {
      background: #1e293b;
      color: var(--neon-cyan);
      text-transform: uppercase;
      font-size: 0.9rem;
      letter-spacing: 0.1em;
    }

    #login {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      gap: 1.8rem;
    }

    .input {
      width: 100%;
      max-width: 380px;
      padding: 1.1rem;
      font-size: 1.15rem;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      color: var(--text);
      font-family: inherit;
    }

    .message {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      padding: 1rem 2.2rem;
      border-radius: 8px;
      font-weight: bold;
      z-index: 9999;
      min-width: 300px;
      text-align: center;
      box-shadow: 0 6px 20px rgba(0,0,0,0.7);
    }

    .msg-ok   { background: var(--green); color: #000; }
    .msg-err  { background: var(--red);    color: white; }

    @media (max-width: 900px) {
      .timers-row { gap: 1rem; }
      .timer-card { min-width: 240px; padding: 1.2rem 1rem; }
      .timer { font-size: clamp(2.6rem, 9vw, 4rem); }
      .punch-buttons { flex-direction: column; align-items: center; gap: 1.2rem; }
      .btn { min-width: 260px; }
    }
  </style>
</head>
<body>

<div id="login">
  <h1>Attendance Tracker</h1>
  <input id="username" class="input" placeholder="Username" autocomplete="username">
  <input id="password" class="input" type="password" placeholder="Password" autocomplete="current-password">
  <button id="loginBtn" class="btn btn-green">LOGIN</button>
</div>

<div id="app" class="container" style="display:none;">

  <header>
    <h1>Attendance Tracker</h1>
    <div class="welcome">Welcome, <strong id="empName">Administrator</strong></div>
  </header>

  <div class="timers-row">
    <div class="timer-card">
      <h3>TOTAL WORK TODAY</h3>
      <div id="workTime" class="timer work">00:00:00</div>
    </div>
    <div class="timer-card">
      <h3>TOTAL BREAK TODAY</h3>
      <div id="breakTime" class="timer break">00:00:00</div>
    </div>
    <div class="timer-card">
      <h3>OVERTIME TODAY</h3>
      <div id="otTime" class="timer ot">00:00:00</div>
    </div>
  </div>

  <div class="actions-section">
    <h2>ACTIONS</h2>
    <div class="punch-buttons">
      <button id="punchIn" class="btn btn-green" disabled>PUNCH IN</button>
      <button id="punchOut" class="btn btn-red" disabled>PUNCH OUT</button>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Today's Sessions</div>
    <div id="logs">Sessions loaded from sheet.</div>
  </div>

  <div class="section">
    <div class="section-title">Daily Summary</div>
    <button id="refreshSummary" class="btn btn-green" style="display:block; margin:1.5rem auto; min-width:220px;">
      Refresh Summary
    </button>
    <table id="summaryTable">
      <thead>
        <tr><th>Date</th><th>Work</th><th>Break</th><th>Overtime</th></tr>
      </thead>
      <tbody>
        <tr><td colspan="4">No records yet</td></tr>
      </tbody>
    </table>
  </div>

</div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyiy193XUlBQnr2JcPKCu3DIB1de65pQh0xS5jOLrYCjmCRKjnOhnTP3Q791jCEh_fl/exec';

let employeeName = '';
let punchCount = 0;
let timer = null;
let notificationPermission = false;

const punchInBtn = document.getElementById('punchIn');
const punchOutBtn = document.getElementById('punchOut');
const workEl = document.getElementById('workTime');
const breakEl = document.getElementById('breakTime');
const otEl = document.getElementById('otTime');
const logsEl = document.getElementById('logs');
const warningBox = document.getElementById('warningBox');

function formatTime(sec) {
  const h = Math.floor(sec / 3600).toString().padStart(2, '0');
  const m = Math.floor((sec % 3600) / 60).toString().padStart(2, '0');
  const s = Math.floor(sec % 60).toString().padStart(2, '0');
  return `${h}:${m}:${s}`;
}

function show(msg, type = 'ok') {
  const div = document.createElement('div');
  div.className = `message ${type === 'ok' ? 'msg-ok' : type === 'err' ? 'msg-err' : 'msg-warn'}`;
  div.textContent = msg;
  document.body.appendChild(div);
  setTimeout(() => div.remove(), 5000);
}

function showWarning(msg) {
  warningBox.textContent = msg;
  warningBox.style.display = msg ? 'block' : 'none';
}

async function requestNotifications() {
  if (!("Notification" in window)) return;
  if (Notification.permission === "granted") {
    notificationPermission = true;
    return;
  }
  if (Notification.permission !== "denied") {
    const perm = await Notification.requestPermission();
    notificationPermission = perm === "granted";
    if (notificationPermission) show("Notifications enabled", "ok");
  }
}

async function fetchToday() {
  if (!employeeName) return;
  try {
    const r = await fetch(SCRIPT_URL, {
      method: 'POST',
      headers: {'Content-Type': 'text/plain'},
      body: JSON.stringify({ action: 'get_today_totals', employeeName })
    });
    const d = await r.json();
    if (d.status !== 'success') throw new Error(d.message || 'failed');

    const workSec = d.workSeconds || 0;
    let breakSec = d.breakSeconds || 0;
    const otSec = d.overtimeSeconds || 0;

    workEl.textContent = formatTime(workSec);
    breakEl.textContent = formatTime(breakSec);
    otEl.textContent = formatTime(otSec);

    punchCount = d.punchCount || punchCount;

    let warning = '';
    if (punchCount >= 8) {
      warning += 'Max 8 punches reached. This is your last punch for the day. ';
    }
    if (breakSec > 2700) {
      warning += 'Break exceeded 45 minutes! ';
    }
    if (punchCount % 2 !== 0) {
      warning += 'Unmatched punch detected - please check your sessions. ';
    }
    if (workSec + breakSec / 60 > 540) {
      warning += 'Total day time exceeded 9 hours including break. ';
    }
    showWarning(warning);

    if (notificationPermission && otSec > 3600) {
      new Notification("Overtime Alert", { body: `You have ${formatTime(otSec)} overtime.`, icon: 'https://via.placeholder.com/192/f59e0b/0d1b2a?text=OT' });
    }
    if (notificationPermission && breakSec > 2700) {
      new Notification("Break Exceeded", { body: `Break is ${formatTime(breakSec)} - exceeded 45 min limit.`, icon: 'https://via.placeholder.com/192/ef4444/0d1b2a?text=BRK' });
    }
  } catch (e) {
    console.warn(e);
    show("Error updating timers", 'err');
  }
}

async function loadSummary() {
  if (!employeeName) return;
  const tbody = document.querySelector('#summaryTable tbody');
  tbody.innerHTML = '<tr><td colspan="4">Loading...</td></tr>';

  try {
    const r = await fetch(SCRIPT_URL, {
      method: 'POST',
      headers: {'Content-Type': 'text/plain'},
      body: JSON.stringify({ action: 'get_daily_summary', employeeName })
    });
    const d = await r.json();
    if (d.status !== 'success') throw new Error(d.message || 'failed');

    tbody.innerHTML = '';
    if (d.summaries.length === 0) {
      tbody.innerHTML = '<tr><td colspan="4">No records yet</td></tr>';
      return;
    }
    d.summaries.forEach(row => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${row.date}</td>
        <td>${formatTime(row.work)}</td>
        <td>${formatTime(row.break)}</td>
        <td>${formatTime(row.overtime)}</td>
      `;
      tbody.appendChild(tr);
    });
  } catch (e) {
    tbody.innerHTML = '<tr><td colspan="4">Error loading summary</td></tr>';
    show("Error loading summary", 'err');
  }
}

async function fetchLogs() {
  logsEl.innerHTML = 'Loading today\'s sessions...';
  try {
    const r = await fetch(SCRIPT_URL, {
      method: 'POST',
      headers: {'Content-Type': 'text/plain'},
      body: JSON.stringify({ action: 'get_today_totals', employeeName })
    });
    const d = await r.json();
    logsEl.innerHTML = 'Sessions loaded from sheet.';
  } catch (e) {
    logsEl.innerHTML = 'Error loading logs';
  }
}

document.getElementById('loginBtn').onclick = async () => {
  const u = document.getElementById('username').value.trim();
  const p = document.getElementById('password').value.trim();
  if (!u || !p) return show("Enter username & password", "err");

  try {
    const r = await fetch(SCRIPT_URL, {
      method: 'POST',
      headers: {'Content-Type': 'text/plain'},
      body: JSON.stringify({ action: 'login', username: u, password: p })
    });
    const d = await r.json();
    if (d.status !== 'success') throw new Error(d.message || 'Login failed');

    employeeName = d.employeeName;
    document.getElementById('empName').textContent = employeeName;
    document.getElementById('login').style.display = 'none';
    document.getElementById('app').style.display = 'block';

    punchInBtn.disabled = false;
    requestNotifications();
    fetchToday();
    fetchLogs();
    loadSummary();
    timer = setInterval(fetchToday, 30000);
  } catch (e) {
    show(e.message || "Connection error", "err");
  }
};

punchInBtn.onclick = async () => {
  if (punchCount >= 8) return show("Max punches reached for today", "err");
  punchInBtn.disabled = true;
  punchOutBtn.disabled = false;
  try {
    await fetch(SCRIPT_URL, {
      method: 'POST',
      headers: {'Content-Type': 'text/plain'},
      body: JSON.stringify({ employeeName, punchType: 'PUNCH IN', timestamp: new Date().toISOString(), source: 'Web' })
    });
    punchCount++;
    fetchToday();
    fetchLogs();
    show("PUNCH IN recorded", "ok");
  } catch (e) {
    show("Error recording punch", "err");
    punchInBtn.disabled = false;
    punchOutBtn.disabled = true;
  }
};

punchOutBtn.onclick = async () => {
  if (punchCount >= 8) return show("Max punches reached for today", "err");
  punchInBtn.disabled = false;
  punchOutBtn.disabled = true;
  try {
    await fetch(SCRIPT_URL, {
      method: 'POST',
      headers: {'Content-Type': 'text/plain'},
      body: JSON.stringify({ employeeName, punchType: 'PUNCH OUT', timestamp: new Date().toISOString(), source: 'Web' })
    });
    punchCount++;
    fetchToday();
    fetchLogs();
    show("PUNCH OUT recorded", "ok");
  } catch (e) {
    show("Error recording punch", "err");
    punchInBtn.disabled = true;
    punchOutBtn.disabled = false;
  }
};

document.getElementById('refreshSummary').onclick = loadSummary;
</script>

</body>
</html>
