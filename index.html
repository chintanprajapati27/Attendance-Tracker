<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance Tracker v1.0</title>

  <!-- Favicon -->
  <link rel="icon" href="/fingerprintscan.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/fingerprintscan.png" sizes="180x180">
  <meta name="theme-color" content="#0d1b2a">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0d1b2a;
      --panel: #1b263b;
      --card: #16213e;
      --primary: #415a77;
      --text: #e0fbfc;
      --accent: #00bcd4;
      --green: #4ade80;
      --red: #ef4444;
      --yellow: #f59e0b;
      --warning: #f59e0b;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Share Tech Mono', monospace;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 0;
      min-height: 100vh;
      line-height: 1.4;
    }

    .container {
      padding: 1.5rem;
      max-width: 1000px;
      margin: 0 auto;
      width: 100%;
    }

    h1 {
      font-size: clamp(1.8rem, 5vw, 2.5rem);
      color: var(--accent);
      text-align: center;
      margin: 0 0 0.5rem;
      font-weight: 700;
    }

    .welcome {
      text-align: center;
      font-size: 1.1rem;
      margin-bottom: 1.5rem;
      color: var(--text);
    }

    .welcome strong {
      color: var(--accent);
    }

    .warning-box {
      background: linear-gradient(135deg, var(--warning), #d97706);
      color: #000;
      padding: 1rem;
      border-radius: 0.8rem;
      margin: 1rem 0;
      font-weight: 700;
      text-align: center;
      border: 1px solid #eab308;
      display: none;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1rem;
      margin: 1.5rem 0;
    }

    .card {
      background: var(--card);
      border: 2px solid var(--primary);
      border-radius: 1rem;
      padding: 1.5rem 1rem;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--accent), var(--primary));
    }

    .card h3 {
      font-size: 0.95rem;
      margin: 0 0 0.8rem;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .time {
      font-size: clamp(2.5rem, 12vw, 4.5rem);
      font-weight: 700;
      letter-spacing: 0.1em;
      margin: 0;
      text-shadow: 
        0 0 5px currentColor,
        0 0 10px currentColor,
        0 0 15px currentColor,
        0 0 20px currentColor;
      filter: drop-shadow(0 0 5px currentColor);
    }

    .time.work { color: var(--accent); }
    .time.break { color: var(--red); }
    .time.ot { color: var(--yellow); }

    .punch-section {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 1rem;
      align-items: center;
      margin: 2rem 0;
    }

    .punch-section h3 {
      text-align: center;
      font-size: 1.1rem;
      color: var(--accent);
      margin: 0;
      grid-column: 1 / -1;
    }

    .punch-controls {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      padding: 1rem 2rem;
      font-size: 1.15rem;
      font-weight: 700;
      border: none;
      border-radius: 0.8rem;
      cursor: pointer;
      transition: all 0.2s ease;
      min-width: 140px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .btn-green {
      background: linear-gradient(135deg, var(--green), #22c55e);
      color: #000;
      box-shadow: 0 4px 15px rgba(74, 222, 128, 0.3);
    }

    .btn-red {
      background: linear-gradient(135deg, var(--red), #dc2626);
      color: white;
      box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      box-shadow: none;
    }

    .btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.4);
    }

    .logs-section {
      margin: 1.5rem 0;
    }

    .logs-section h3 {
      text-align: center;
      color: var(--primary);
      margin: 0 0 1rem;
      font-size: 1.1rem;
    }

    #logs {
      background: var(--panel);
      border: 1px solid var(--primary);
      border-radius: 0.8rem;
      padding: 1.2rem;
      min-height: 80px;
      font-size: 0.95rem;
      line-height: 1.5;
      text-align: center;
      color: var(--text);
    }

    .summary-section {
      margin-top: 2rem;
    }

    .summary-section h3 {
      text-align: center;
      color: var(--accent);
      margin: 0 0 1rem;
      font-size: 1.2rem;
    }

    #refreshSummary {
      display: block;
      margin: 0 auto 1.5rem;
      width: 200px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--card);
      border-radius: 0.8rem;
      overflow: hidden;
      font-size: 0.9rem;
    }

    th, td {
      padding: 1rem 0.5rem;
      text-align: center;
      border-bottom: 1px solid var(--primary);
    }

    th {
      background: var(--panel);
      color: var(--accent);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    tbody tr:hover {
      background: rgba(65, 90, 119, 0.1);
    }

    tbody td {
      color: var(--text);
    }

    .input {
      padding: 1rem;
      font-size: 1.1rem;
      border: 2px solid var(--primary);
      border-radius: 0.8rem;
      background: var(--panel);
      color: var(--text);
      font-family: inherit;
      width: 100%;
      max-width: 300px;
      margin-bottom: 1rem;
    }

    #login {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 2rem 1rem;
      gap: 1.5rem;
    }

    #login h2 {
      color: var(--accent);
      font-size: 1.8rem;
      margin: 0;
    }

    #app {
      display: none;
    }

    .message {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      padding: 1rem 2rem;
      border-radius: 0.8rem;
      font-weight: 700;
      z-index: 1000;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      min-width: 250px;
      text-align: center;
    }

    .msg-ok { background: var(--green); color: #000; }
    .msg-err { background: var(--red); color: white; }
    .msg-warn { background: var(--warning); color: #000; }

    @media (max-width: 768px) {
      .container { padding: 1rem; }
      .stats-grid { grid-template-columns: repeat(3, 1fr); gap: 0.8rem; }
      .punch-section { grid-template-columns: 1fr; }
      .punch-controls { flex-direction: column; align-items: center; gap: 0.8rem; }
      .btn { width: 100%; max-width: 280px; }
      .time { font-size: clamp(2rem, 10vw, 3.5rem); letter-spacing: 0.08em; }
      table { font-size: 0.85rem; }
      th, td { padding: 0.8rem 0.3rem; }
    }

    @media (max-width: 480px) {
      .stats-grid { grid-template-columns: 1fr; }
      .punch-controls .btn { min-width: auto; }
    }
  </style>
</head>
<body>

<div id="login">
  <h2>Employee Login</h2>
  <input id="username" class="input" placeholder="Username" autocomplete="username">
  <input id="password" class="input" type="password" placeholder="Password" autocomplete="current-password">
  <button id="loginBtn" class="btn btn-green">LOGIN</button>
</div>

<div id="app" class="container">

  <h1>Attendance Tracker</h1>
  <p class="welcome">Welcome, <strong id="empName"></strong></p>

  <div id="warningBox" class="warning-box"></div>

  <div class="stats-grid">
    <div class="card">
      <h3>Total Work Today</h3>
      <div id="workTime" class="time work">00:00:00</div>
    </div>
    <div class="card">
      <h3>Total Break Today</h3>
      <div id="breakTime" class="time break">00:00:00</div>
    </div>
    <div class="card">
      <h3>Overtime Today</h3>
      <div id="otTime" class="time ot">00:00:00</div>
    </div>
  </div>

  <div class="punch-section">
    <h3>Actions</h3>
    <div class="punch-controls">
      <button id="punchIn" class="btn btn-green" disabled>PUNCH IN</button>
      <button id="punchOut" class="btn btn-red" disabled>PUNCH OUT</button>
    </div>
  </div>

  <div class="logs-section card">
    <h3>Today's Sessions</h3>
    <div id="logs">Loading today's sessions...</div>
  </div>

  <div class="summary-section">
    <h3>Daily Summary</h3>
    <button id="refreshSummary" class="btn btn-green">Refresh Summary</button>
    <table id="summaryTable">
      <thead>
        <tr><th>Date</th><th>Work</th><th>Break</th><th>Overtime</th></tr>
      </thead>
      <tbody>
        <tr><td colspan="4">No records yet</td></tr>
      </tbody>
    </table>
  </div>

</div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyiy193XUlBQnr2JcPKCu3DIB1de65pQh0xS5jOLrYCjmCRKjnOhnTP3Q791jCEh_fl/exec';

let employeeName = '';
let punchCount = 0;
let timer = null;
let notificationPermission = false;

const punchInBtn = document.getElementById('punchIn');
const punchOutBtn = document.getElementById('punchOut');
const workEl = document.getElementById('workTime');
const breakEl = document.getElementById('breakTime');
const otEl = document.getElementById('otTime');
const logsEl = document.getElementById('logs');
const warningBox = document.getElementById('warningBox');

function formatTime(sec) {
  const h = Math.floor(sec / 3600).toString().padStart(2, '0');
  const m = Math.floor((sec % 3600) / 60).toString().padStart(2, '0');
  const s = Math.floor(sec % 60).toString().padStart(2, '0');
  return `${h}:${m}:${s}`;
}

function show(msg, type = 'ok') {
  const div = document.createElement('div');
  div.className = `message ${type === 'ok' ? 'msg-ok' : type === 'err' ? 'msg-err' : 'msg-warn'}`;
  div.textContent = msg;
  document.body.appendChild(div);
  setTimeout(() => div.remove(), 5000);
}

function showWarning(msg) {
  warningBox.textContent = msg;
  warningBox.style.display = msg ? 'block' : 'none';
}

async function requestNotifications() {
  if (!("Notification" in window)) return;
  if (Notification.permission === "granted") {
    notificationPermission = true;
    return;
  }
  if (Notification.permission !== "denied") {
    const perm = await Notification.requestPermission();
    notificationPermission = perm === "granted";
    if (notificationPermission) show("Notifications enabled", "ok");
  }
}

async function fetchToday() {
  if (!employeeName) return;
  try {
    const r = await fetch(SCRIPT_URL, {
      method: 'POST',
      headers: {'Content-Type': 'text/plain'},
      body: JSON.stringify({ action: 'get_today_totals', employeeName })
    });
    const d = await r.json();
    if (d.status !== 'success') throw new Error(d.message || 'failed');

    const workSec = d.workSeconds || 0;
    let breakSec = d.breakSeconds || 0;
    const otSec = d.overtimeSeconds || 0;

    workEl.textContent = formatTime(workSec);
    breakEl.textContent = formatTime(breakSec);
    otEl.textContent = formatTime(otSec);

    punchCount = d.punchCount || punchCount;

    let warning = '';
    if (punchCount >= 8) {
      warning += 'Max 8 punches reached. This is your last punch for the day. ';
    }
    if (breakSec > 2700) {
      warning += 'Break exceeded 45 minutes! ';
    }
    if (punchCount % 2 !== 0) {
      warning += 'Unmatched punch detected - please check your sessions. ';
    }
    if (workSec + breakSec / 60 > 540) {
      warning += 'Total day time exceeded 9 hours including break. ';
    }
    showWarning(warning);

    if (notificationPermission && otSec > 3600) {
      new Notification("Overtime Alert", { body: `You have ${formatTime(otSec)} overtime.`, icon: 'https://via.placeholder.com/192/f59e0b/0d1b2a?text=OT' });
    }
    if (notificationPermission && breakSec > 2700) {
      new Notification("Break Exceeded", { body: `Break is ${formatTime(breakSec)} - exceeded 45 min limit.`, icon: 'https://via.placeholder.com/192/ef4444/0d1b2a?text=BRK' });
    }
  } catch (e) {
    console.warn(e);
    show("Error updating timers", 'err');
  }
}

async function loadSummary() {
  if (!employeeName) return;
  const tbody = document.querySelector('#summaryTable tbody');
  tbody.innerHTML = '<tr><td colspan="4">Loading...</td></tr>';

  try {
    const r = await fetch(SCRIPT_URL, {
      method: 'POST',
      headers: {'Content-Type': 'text/plain'},
      body: JSON.stringify({ action: 'get_daily_summary', employeeName })
    });
    const d = await r.json();
    if (d.status !== 'success') throw new Error(d.message || 'failed');

    tbody.innerHTML = '';
    if (d.summaries.length === 0) {
      tbody.innerHTML = '<tr><td colspan="4">No records yet</td></tr>';
      return;
    }
    d.summaries.forEach(row => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${row.date}</td>
        <td>${formatTime(row.work)}</td>
        <td>${formatTime(row.break)}</td>
        <td>${formatTime(row.overtime)}</td>
      `;
      tbody.appendChild(tr);
    });
  } catch (e) {
    tbody.innerHTML = '<tr><td colspan="4">Error loading summary</td></tr>';
    show("Error loading summary", 'err');
  }
}

async function fetchLogs() {
  logsEl.innerHTML = 'Loading today\'s sessions...';
  try {
    const r = await fetch(SCRIPT_URL, {
      method: 'POST',
      headers: {'Content-Type': 'text/plain'},
      body: JSON.stringify({ action: 'get_today_totals', employeeName })
    });
    const d = await r.json();
    logsEl.innerHTML = 'Sessions loaded from sheet.';
  } catch (e) {
    logsEl.innerHTML = 'Error loading logs';
  }
}

document.getElementById('loginBtn').onclick = async () => {
  const u = document.getElementById('username').value.trim();
  const p = document.getElementById('password').value.trim();
  if (!u || !p) return show("Enter username & password", "err");

  try {
    const r = await fetch(SCRIPT_URL, {
      method: 'POST',
      headers: {'Content-Type': 'text/plain'},
      body: JSON.stringify({ action: 'login', username: u, password: p })
    });
    const d = await r.json();
    if (d.status !== 'success') throw new Error(d.message || 'Login failed');

    employeeName = d.employeeName;
    document.getElementById('empName').textContent = employeeName;
    document.getElementById('login').style.display = 'none';
    document.getElementById('app').style.display = 'block';

    punchInBtn.disabled = false;
    requestNotifications();
    fetchToday();
    fetchLogs();
    loadSummary();
    timer = setInterval(fetchToday, 30000);
  } catch (e) {
    show(e.message || "Connection error", "err");
  }
};

punchInBtn.onclick = async () => {
  if (punchCount >= 8) return show("Max punches reached for today", "err");
  punchInBtn.disabled = true;
  punchOutBtn.disabled = false;
  try {
    await fetch(SCRIPT_URL, {
      method: 'POST',
      headers: {'Content-Type': 'text/plain'},
      body: JSON.stringify({ employeeName, punchType: 'PUNCH IN', timestamp: new Date().toISOString(), source: 'Web' })
    });
    punchCount++;
    fetchToday();
    fetchLogs();
    show("PUNCH IN recorded", "ok");
  } catch (e) {
    show("Error recording punch", "err");
    punchInBtn.disabled = false;
    punchOutBtn.disabled = true;
  }
};

punchOutBtn.onclick = async () => {
  if (punchCount >= 8) return show("Max punches reached for today", "err");
  punchInBtn.disabled = false;
  punchOutBtn.disabled = true;
  try {
    await fetch(SCRIPT_URL, {
      method: 'POST',
      headers: {'Content-Type': 'text/plain'},
      body: JSON.stringify({ employeeName, punchType: 'PUNCH OUT', timestamp: new Date().toISOString(), source: 'Web' })
    });
    punchCount++;
    fetchToday();
    fetchLogs();
    show("PUNCH OUT recorded", "ok");
  } catch (e) {
    show("Error recording punch", "err");
    punchInBtn.disabled = true;
    punchOutBtn.disabled = false;
  }
};

document.getElementById('refreshSummary').onclick = loadSummary;
</script>

</body>
</html>
